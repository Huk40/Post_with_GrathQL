services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: posts
      POSTGRES_USER: posts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo}
    volumes:
      - posts-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posts -d posts"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    command: ["-addr=:8080", "-storage=postgres"]
    environment:
      PGHOST: db
      PGUSER: posts
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-demo}
      DATABASE_URL: "dbname=posts sslmode=disable"
      DEMO_AUTHOR_TOKEN: ${DEMO_AUTHOR_TOKEN:-local-author-one}
      SECOND_AUTHOR_TOKEN: ${SECOND_AUTHOR_TOKEN:-local-author-two}
    ports:
      - "127.0.0.1:${POSTS_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  posts-data:

